# OpenSpoof CPU Catalog
#
# Pipe-delimited records:
#   key|label|hardware|processor|part|implementer|feature_mask
#
# This catalog is consumed in two ways:
#   1. The WebUI uses key + label for the picker. Selecting a CPU
#      profile injects the corresponding hardware/processor strings
#      into the app via the __system_property_get / uname hooks
#      (already in place in src/hooks.cpp).
#   2. If a per-app /proc/cpuinfo override is requested, the loader
#      will additionally read module/cpuinfo/<key> at runtime.
#      For now we only ship the metadata; cpuinfo files can be added
#      on demand.
#
# Strings below come from each SoC vendor's published reference.
# Feature bits are the standard arm64 AT_HWCAP set.

