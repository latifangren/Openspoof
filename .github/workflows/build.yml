name: Build OpenSpoof

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR when a new commit
# arrives. Saves CI minutes for fast-iterating contributors.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zygisk Module
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full clone is needed so actions/cache can hash .git/HEAD, but
          # we still avoid paying for unrelated history on shallow clones.
          fetch-depth: 0

      - name: Setup Android NDK (r27b)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          link-to-sdk: true

      # Speed up: cache the NDK install across runs. Keyed on the NDK
      # version so a version bump invalidates the cache automatically.
      # The setup-ndk action installs into a per-version path; caching
      # that path avoids the ~1GB download on subsequent runs.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-ndk.outputs.ndk-path }}
          # nttld/setup-ndk exposes "ndk-full-version" (e.g. 27.3.13704824)
          # which is more stable than the input "r27b" tag for cache keys.
          key: ndk-${{ steps.setup-ndk.outputs.ndk-full-version }}-${{ runner.os }}-v1
          restore-keys: |
            ndk-${{ steps.setup-ndk.outputs.ndk-full-version }}-

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip curl shellcheck clang g++

      - name: Run shell tests
        run: |
          chmod +x tests/run.sh tests/test_*.sh
          ./tests/run.sh

      # Cheap static check: catch syntax errors in C++ without paying
      # for a full NDK link. We use the NDK's own clang++ so the
      # sysroot and target triple are configured exactly the way
      # scripts/build.sh configures them at build time. That way
      # jni.h, android/log.h, and any other NDK header resolve
      # without us having to hand-roll include paths that drift
      # across NDK versions.
      - name: C++ syntax check (NDK clang++)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "Using NDK clang: $NDK_CLANG"
          ls -la "$NDK_CLANG" || true
          if [ ! -f src/zygisk.hpp ]; then
            echo "fetching zygisk.hpp..."
            curl -sL -o src/zygisk.hpp \
              https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          fi
          DOBBY_FLAGS=""
          if [ -d "third_party/dobby/include" ]; then
            DOBBY_FLAGS="-DHAVE_DOBBY -Ithird_party/dobby/include"
          fi
          "$NDK_CLANG" -fsyntax-only -std=c++17 -Wall -Wextra \
            $DOBBY_FLAGS -I src \
            --target=x86_64-linux-android21 \
            --sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            src/spoof.cpp src/hooks.cpp src/f5_art_hooks.cpp 2>&1 | tee cxx-syntax.log

      # Lint the shell scripts that ship in module/, scripts/, and tests/.
      # We use --severity=warning so style nits don't fail the run, but
      # real bugs (unquoted vars, missing set -e) are caught.
      - name: Shellcheck
        run: |
          shellcheck --severity=warning -x \
            scripts/build.sh scripts/build_dobby.sh \
            module/customize.sh module/service.sh module/uninstall.sh \
            module/sepolicy_helper.sh \
            tests/run.sh tests/test_sepolicy_helper.sh

      - name: Build Dobby (multi-ABI Static Library)
        run: |
          chmod +x scripts/build_dobby.sh
          ./scripts/build_dobby.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build & Package OpenSpoof Module
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh 0.2.0
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Flashable Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openspoof-module
          path: openspoof-v*.zip
          if-no-files-found: error

      - name: Upload C++ syntax log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxx-syntax-log
          path: cxx-syntax.log
          if-no-files-found: ignore
